<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSense AI — Smart Farm Intelligence</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">🌾</div>
            <h1 class="brand-title">AgriSense AI</h1>
            <span class="brand-subtitle">YIELD INTELLIGENCE</span>
        </div>
        <div class="sidebar-divider"></div>
        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-item active" data-page="dashboard">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#predictor" class="nav-item" data-page="predictor">
                <span class="nav-icon">🔬</span>
                <span class="nav-label">Yield Predictor</span>
            </a>
            <a href="#analytics" class="nav-item" data-page="analytics">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Analytics</span>
            </a>
            <a href="#batch" class="nav-item" data-page="batch">
                <span class="nav-icon">📁</span>
                <span class="nav-label">Batch Prediction</span>
            </a>
            <a href="#history" class="nav-item" data-page="history">
                <span class="nav-icon">📈</span>
                <span class="nav-label">History</span>
            </a>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-info">
            <div class="info-label">System Info</div>
            <div class="info-row">
                <span>Model</span>
                <span class="info-value">RF+XGB+LGBM</span>
            </div>
            <div class="info-row">
                <span>Version</span>
                <span class="info-value">v1.0.0</span>
            </div>
            <div class="info-row">
                <span>Status</span>
                <span class="info-value status-online" id="system-status">● Online</span>
            </div>
        </div>
        <div class="sidebar-footer">
            Built with ❤️ using Ensemble ML<br>
            <span>© 2024 AgriSense AI</span>
        </div>
    </aside>

    <!-- Mobile Header -->
    <header class="mobile-header" id="mobile-header">
        <button class="hamburger" id="hamburger">☰</button>
        <span class="mobile-brand">🌾 AgriSense AI</span>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <div id="page-container"></div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/predictor.js"></script>
    <script src="js/pages/analytics.js"></script>
    <script src="js/pages/batch.js"></script>
    <script src="js/pages/history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
